name: Public Actions runner smoke

on:
  push:
    branches:
      - ops/public-actions-runner-smoke-20260822
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/public-actions-runner-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-actions-runner-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: public-runner-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm public runner allocation
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLIC_RUNNER_ALLOCATED=true"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "SHA=${GITHUB_SHA}"
          node --version
